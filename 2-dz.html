<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <style>
body{       
background-color: #F39494;
background:
    linear-gradient(243.43deg, #FFA5A5 32.96%, rgba(255,255,255,0) 82.03%),
    linear-gradient(243.18deg, #FDC5C5 25.45%, rgba(242,152,222,0) 100%);}

main{background-color: #FFFEFE;}
h1{
    color: #333333;
    font-size: 36px;
    font-weight: 700;
    font-family: "Open Sans", sans-serif;}
p{
    color: #666666;
    font-size: 18px;
    font-weight: 400;
    font-family: "Open Sans", sans-serif;}
a{
    color: #089FE0;
    font-size: 18px;
    font-weight: 400;
    font-family: "Open Sans", sans-serif;
    font-style: solid;
}
.white-input{
    background-color: #FFFFFF;
    color: #333333;
    font-size: 16px;
    font-weight: 600;
    font-family: "Open Sans", sans-serif;}
.gray-input{
    background-color: #F5F5F5;
    color: #999999;
    font-size: 16px;
    font-weight: 400;
    font-family: "Open Sans", sans-serif;}
button{
    background-color: #089FE0;
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 400;
    font-family: "Open Sans", sans-serif;}
.black-input{
    color: #666666;
    font-size: 14px;
    font-weight: 400;
    font-family: "Open Sans", sans-serif;}
footer{
    color: #089FE0;
    font-size: 14px;
    font-weight: 400;
    font-family: "Open Sans", sans-serif;
}    
    </style>
</head>
<body>
    <main>
<h1>Регистрация</h1>
<p>Уже есть аккаунт?</p>
<a href="#">Войти</a>
<form action="#">
    
<div>
    <label for="text">Моя компания</label>
<input type="text" name="text" id="text" class="white-input"/>
</div> 

<div>
    <label for="text"></label>
<input type="text" name="text" id="text" class="gray-input" placeholder="Имя"/>
</div> 

<div>
    <label for="text"></label>
<input type="text" name="text" id="text" class="gray-input" placeholder="Фамилия"/>
</div> 
    
<div>
    <label for="email"></label>
<input type="email" name="email" id="email" class="gray-input" placeholder="E-mail"/>
</div>
<button>Зарегистрироваться</button>
<div>
<label for="agree">Я прочитал и принимаю</label>
    <input type="checkbox" name="agree" id="agree" class="black-input"/>
</div>
<footer>
<a href="#">Условия использования</a>
</footer>
</form>
</main>
</body>
</html>
